<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Intan & Refki</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff7eb9;
            --secondary: #7afcff;
            --dark: #2d3436;
            --white: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff7eb9, #7afcff);
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            color: var(--dark);
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: var(--white);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        h1 { text-align: center; color: #d63384; margin: 0; font-size: 1.5rem; }
        .subtitle { text-align: center; font-size: 0.8em; margin-bottom: 20px; color: #777; }

        .balance-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 15px rgba(37, 117, 252, 0.3);
        }

        .balance-card p { margin: 0; opacity: 0.9; font-size: 0.9em; }
        .balance-card h2 { margin: 5px 0 0; font-size: 2.2em; letter-spacing: 1px; font-weight: 600; }

        /* Statistik Box */
        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stats-box {
            flex: 1;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.75em;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .stats-add { background: #e8f5e9; border-color: #c8e6c9; }
        .stats-draw { background: #ffebee; border-color: #ffcdd2; }

        .stats-box strong { display: block; margin-bottom: 8px; text-align: center; font-size: 1.1em; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .stat-row span:last-child { font-weight: 600; }

        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-size: 1em;
            color: white;
        }

        .btn-add { background: #2ecc71; }
        .btn-withdraw { background: #e74c3c; }
        button:active { transform: scale(0.95); }

        /* History Styling */
        .history-section { 
            margin-top: 30px; 
            padding-top: 20px;
            border-top: 2px dashed #eee;
        }

        .history-item {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
            border-left: 6px solid #ddd;
        }

        .type-masuk { border-left-color: #2ecc71; }
        .type-keluar { border-left-color: #e74c3c; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-info strong { display: block; font-size: 0.95em; color: #333; }
        .item-info span { font-size: 0.75em; color: #888; }
        .item-amount { font-weight: 600; font-size: 1em; }
        
        .loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            display: none; align-items: center; justify-content: center;
            z-index: 100; font-weight: 600;
        }
        .rekening-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 50px;
            width: fit-content;
            margin: 0 auto 20px;
            border: 1px solid #eee;
        }

        .rekening-text {
            font-size: 0.85em;
            color: #555;
            font-weight: 600;
        }
        .btn-copy {
            background: none;
            border: none;
            color: #d63384;
            cursor: pointer;
            padding: 5px;
            font-size: 1em;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }

        .btn-copy:hover { color: #ff7eb9; transform: scale(1.1); }
        .btn-copy:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div class="loader" id="loader">Sinkronisasi Data... ⏳</div>

<div class="container">
    <h1>💕 Tabungan Berdua</h1>
        <div class="rekening-container">
        <span class="rekening-text" id="no-rek">770074748888 (Krom)</span>
        <button class="btn-copy" onclick="copyRekening()" title="Salin Nomor Rekening">
            <i class="fa-regular fa-copy"></i>
        </button>
        </div>

    <div class="balance-card">
        <p>Total Saldo Saat Ini</p>
        <h2 id="total-saldo">Rp 0</h2>
    </div>

    <div class="stats-container">
        <div class="stats-box stats-add">
            <strong style="color: #2e7d32;">Total Menabung</strong>
            <div class="stat-row"><span>Refki:</span> <span id="add-refki">Rp 0</span></div>
            <div class="stat-row"><span>Intan:</span> <span id="add-intan">Rp 0</span></div>
        </div>
        <div class="stats-box stats-draw">
            <strong style="color: #c62828;">Total Ditarik</strong>
            <div class="stat-row"><span>Refki:</span> <span id="draw-refki">Rp 0</span></div>
            <div class="stat-row"><span>Intan:</span> <span id="draw-intan">Rp 0</span></div>
        </div>
    </div>

    <div class="form-group">
        <label>Nama Penginput</label>
        <select id="user">
            <option value="Refki">Refki</option>
            <option value="Intan">Intan</option>
        </select>
    </div>

    <div class="form-group">
        <label>Nominal (Rp)</label>
        <input type="number" id="amount" placeholder="Contoh: 50000">
    </div>

    <div class="form-group">
        <label>Alasan / Keperluan</label>
        <textarea id="note" rows="2" placeholder="Nabung jajan / beli bakso"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-add" onclick="processData('Masuk')">Tambah</button>
        <button class="btn-withdraw" onclick="processData('Keluar')">Tarik</button>
    </div>

    <div class="history-section">
        <h3 style="margin-bottom: 15px; font-size: 1.1em; color: #d63384;">Riwayat Transaksi</h3>
        <div id="history-list"></div>
    </div>
</div>

<script>
    // GANTI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzTYVLwoHvHeefAze2bxMzMbYkgJiQ2uj-18elNpg_YhbS_ep882REAMLf_Cz4JM7pt/exec";
    
    let ALL_DATA = [];
function copyRekening() {
        const rekText = "770074748888";
        navigator.clipboard.writeText(rekText).then(() => {
            const btn = document.querySelector('.btn-copy i');
            btn.className = "fa-solid fa-check"; // Ubah ikon jadi centang
            setTimeout(() => {
                btn.className = "fa-regular fa-copy"; // Balikin ikon semula
            }, 2000);
        });
}
    async function processData(tipe) {
        const user = document.getElementById('user').value;
        const amount = document.getElementById('amount').value;
        const note = document.getElementById('note').value;
        const loader = document.getElementById('loader');

        if (!amount || !note) {
            alert("Harap isi nominal dan alasannya ya!");
            return;
        }

        loader.style.display = "flex";

        const now = new Date();
        const tglWIB = now.toLocaleString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric'
        });
        const jamWIB = now.toLocaleString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            hour: '2-digit', 
            minute: '2-digit' 
        });

        const payload = {
            tanggal: `${tglWIB}, ${jamWIB} WIB`,
            nama: user,
            tipe: tipe,
            jumlah: parseInt(amount),
            alasan: note
        };

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            await loadData();
        } catch (error) {
            alert("Gagal terhubung ke database!");
        } finally {
            loader.style.display = "none";
        }
    }

    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            ALL_DATA = await response.json();
            updateUI();
        } catch (error) {
            console.error("Gagal load data");
            document.getElementById('history-list').innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>';
        }
    }

    function updateUI() {
        let totalSaldo = 0;
        let addRefki = 0, addIntan = 0;
        let drawRefki = 0, drawIntan = 0;
        let htmlHistory = '';

        if (!ALL_DATA || ALL_DATA.length <= 1) {
            document.getElementById('history-list').innerHTML = '<p style="text-align:center; color:#999; font-size:0.9em;">Belum ada riwayat.</p>';
            return;
        }

        // Hitung total saldo dari urutan normal (awal ke akhir)
        for (let i = 1; i < ALL_DATA.length; i++) {
            const [tgl, nama, tipe, jumlah, alasan] = ALL_DATA[i];
            const nominal = parseInt(jumlah) || 0;

            if (tipe === "Masuk") {
                totalSaldo += nominal;
                if (nama === "Refki") addRefki += nominal;
                else if (nama === "Intan") addIntan += nominal;
            } else {
                totalSaldo -= nominal;
                if (nama === "Refki") drawRefki += nominal;
                else if (nama === "Intan") drawIntan += nominal;
            }
        }

        // Generate Riwayat dari data terbaru (akhir ke awal)
        for (let i = ALL_DATA.length - 1; i > 0; i--) {
            const [tgl, nama, tipe, jumlah, alasan] = ALL_DATA[i];
            const nominal = parseInt(jumlah) || 0;

            htmlHistory += `
                <div class="history-item ${tipe === 'Masuk' ? 'type-masuk' : 'type-keluar'}">
                    <div class="item-info">
                        <strong>${alasan}</strong>
                        <span>${nama} • ${tgl}</span>
                    </div>
                    <div class="item-amount" style="color: ${tipe === 'Masuk' ? '#2ecc71' : '#e74c3c'}">
                        ${tipe === 'Masuk' ? '+' : '-'} ${formatRupiah(nominal)}
                    </div>
                </div>
            `;
        }

        // Tampilkan ke layar
        document.getElementById('total-saldo').innerText = formatRupiah(totalSaldo);
        document.getElementById('add-refki').innerText = formatRupiah(addRefki);
        document.getElementById('add-intan').innerText = formatRupiah(addIntan);
        document.getElementById('draw-refki').innerText = formatRupiah(drawRefki);
        document.getElementById('draw-intan').innerText = formatRupiah(drawIntan);
        document.getElementById('history-list').innerHTML = htmlHistory;
    }

    function formatRupiah(angka) {
        return "Rp " + (angka || 0).toLocaleString('id-ID');
    }

    // Jalankan load data saat halaman dibuka
    loadData();
</script>

</body>
</html>
