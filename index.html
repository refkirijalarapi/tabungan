<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Intan & Refki</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7eb9;
            --secondary: #7afcff;
            --dark: #2d3436;
            --white: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff7eb9, #7afcff);
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            color: var(--dark);
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: var(--white);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        h1 { text-align: center; color: #d63384; margin: 0; font-size: 1.5rem; }
        .subtitle { text-align: center; font-size: 0.8em; margin-bottom: 20px; color: #777; }

        .balance-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 15px rgba(37, 117, 252, 0.3);
        }

        .balance-card p { margin: 0; opacity: 0.9; font-size: 0.9em; }
        .balance-card h2 { margin: 5px 0 0; font-size: 2.2em; letter-spacing: 1px; font-weight: 600; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            font-size: 1em;
        }

        .btn-add { background: #2ecc71; color: white; }
        .btn-withdraw { background: #e74c3c; color: white; }
        button:active { transform: scale(0.95); }

        .history-section { 
            margin-top: 30px; 
            padding-top: 20px;
            border-top: 2px dashed #eee;
        }

        .history-item {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
            border-left: 6px solid #ddd;
        }

        .type-masuk { border-left-color: #2ecc71; }
        .type-keluar { border-left-color: #e74c3c; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-info strong { display: block; font-size: 0.95em; color: #333; }
        .item-info span { font-size: 0.75em; color: #888; }
        .item-amount { font-weight: 600; font-size: 1em; }
        
        .loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            display: none; align-items: center; justify-content: center;
            z-index: 100; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="loader" id="loader">Sinkronisasi Data... ⏳</div>

<div class="container">
    <h1>💕 Tabungan Berdua</h1>

    <div class="balance-card">
        <p>Total Saldo Saat Ini</p>
        <h2 id="total-saldo">Rp 0</h2>
    </div>

    <div class="form-group">
        <label>Nama Penginput</label>
        <select id="user">
            <option value="Refki">Refki</option>
            <option value="Intan">Intan</option>
        </select>
    </div>

    <div class="form-group">
        <label>Nominal (Rp)</label>
        <input type="number" id="amount" placeholder="Contoh: 100000">
    </div>

    <div class="form-group">
        <label>Alasan / Keperluan</label>
        <textarea id="note" rows="2" placeholder="Nabung sisa gaji / beli hadiah"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-add" onclick="processData('Masuk')">Tambah</button>
        <button class="btn-withdraw" onclick="processData('Keluar')">Tarik</button>
    </div>

    <div class="history-section">
        <h3 style="margin-bottom: 15px; font-size: 1.1em; color: #d63384;">Semua Riwayat Transaksi</h3>
        <div id="history-list">
            </div>
    </div>
</div>

<script>
    const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzTYVLwoHvHeefAze2bxMzMbYkgJiQ2uj-18elNpg_YhbS_ep882REAMLf_Cz4JM7pt/exec";
    // <--- GANTI DENGAN URL APPS SCRIPT ANDA
    let ALL_DATA = [];

    async function processData(tipe) {
        const user = document.getElementById('user').value;
        const amount = document.getElementById('amount').value;
        const note = document.getElementById('note').value;
        const loader = document.getElementById('loader');

        if (!amount || !note) {
            alert("Harap isi nominal dan alasannya ya!");
            return;
        }

        loader.style.display = "flex";

        const now = new Date();
        const tglWIB = now.toLocaleString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric'
        });
        const jamWIB = now.toLocaleString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            hour: '2-digit', 
            minute: '2-digit' 
        });

        const payload = {
            tanggal: `${tglWIB}, ${jamWIB} WIB`,
            nama: user,
            tipe: tipe,
            jumlah: parseInt(amount),
            alasan: note
        };

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            await loadData();
        } catch (error) {
            alert("Koneksi gagal! Pastikan URL Apps Script sudah benar.");
        } finally {
            loader.style.display = "none";
        }
    }

    async function loadData() {
        const historyList = document.getElementById('history-list');
        try {
            const response = await fetch(SCRIPT_URL);
            ALL_DATA = await response.json();
            
            if (!ALL_DATA || ALL_DATA.length <= 1) {
                historyList.innerHTML = '<p style="text-align:center; color:#999; font-size:0.9em; margin-top:20px;">Belum ada riwayat transaksi.</p>';
                document.getElementById('total-saldo').innerText = "Rp 0";
                return;
            }

            updateBalanceAndHistory();
        } catch (error) {
            console.error("Gagal load data");
            historyList.innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data dari Spreadsheet.</p>';
        }
    }

    function updateBalanceAndHistory() {
        let total = 0;
        let html = '';
        const listDiv = document.getElementById('history-list');

        // Loop dari data terbaru ke terlama (Urutan Terbalik)
        for (let i = ALL_DATA.length - 1; i > 0; i--) {
            const [tgl, nama, tipe, jumlah, alasan] = ALL_DATA[i];
            const nominal = parseInt(jumlah) || 0;

            // Hitung Saldo (dari seluruh data, bukan cuma yang tampil)
            // Namun karena kita loop terbalik, kalkulasi total dilakukan di loop terpisah atau sekalian di sini
            if (tipe === "Masuk") total += nominal;
            else total -= nominal;

            html += `
                <div class="history-item ${tipe === 'Masuk' ? 'type-masuk' : 'type-keluar'}">
                    <div class="item-info">
                        <strong>${alasan}</strong>
                        <span>Oleh: ${nama} • ${tgl}</span>
                    </div>
                    <div class="item-amount" style="color: ${tipe === 'Masuk' ? '#2ecc71' : '#e74c3c'}">
                        ${tipe === 'Masuk' ? '+' : '-'} ${formatRupiah(nominal)}
                    </div>
                </div>
            `;
        }

        // Karena loop terbalik untuk tampilan, kita hitung ulang total dengan urutan benar
        let saldoBenar = 0;
        for (let i = 1; i < ALL_DATA.length; i++) {
            const t = ALL_DATA[i][2];
            const j = parseInt(ALL_DATA[i][3]) || 0;
            if (t === "Masuk") saldoBenar += j;
            else saldoBenar -= j;
        }

        document.getElementById('total-saldo').innerText = formatRupiah(saldoBenar);
        listDiv.innerHTML = html;
    }

    function formatRupiah(angka) {
        return "Rp " + (angka || 0).toLocaleString('id-ID');
    }

    // Jalankan load data saat halaman dibuka
    loadData();
</script>

</body>
</html>
