<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Refki & Intan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root { --primary: #ff7eb9; --dark: #2d3436; --white: rgba(255, 255, 255, 0.95); }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #ff7eb9, #7afcff); min-height: 100vh; margin: 0; padding: 15px; color: var(--dark); }
        .container { max-width: 500px; margin: auto; background: var(--white); padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); position: relative; display: none; }
        .btn-settings { position: absolute; top: 20px; right: 20px; color: #d63384; font-size: 1.2rem; cursor: pointer; z-index: 10; }
        h1 { text-align: center; color: #d63384; margin: 0; font-size: 1.5rem; }
        .subtitle { text-align: center; font-size: 0.8em; margin-bottom: 15px; color: #777; font-weight: 600; }
        
        /* Progress Section */
        .target-section { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #ff7eb9; }
        .target-header { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 8px; font-weight: 600; }
        .progress-container { height: 14px; background: #eee; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff7eb9, #ff1a8c); width: 0%; transition: width 1s; }
        .needed-info { font-size: 0.75em; color: #e74c3c; font-weight: 600; text-align: center; margin-top: 5px; }
        
        /* Charts */
        .charts-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .chart-box { flex: 1; background: #fff; padding: 10px; border-radius: 15px; border: 1px solid #ff7eb9; text-align: center; }
        .chart-box h5 { margin: 0 0 10px; font-size: 0.7em; color: #d63384; }
        canvas { max-width: 100% !important; height: auto !important; }

        .balance-card { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 15px; }
        
        .stats-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .stats-box { flex: 1; padding: 12px; border-radius: 15px; font-size:
        0.75em; border: 1px solid #ff7eb9; }
        .stats-add { background: #e8f5e9; } .stats-draw { background: #ffebee; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        
        .recap-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .recap-box { flex: 1; padding: 10px; border-radius: 15px; text-align: center; font-size: 0.75em; color: white; font-weight: 600; }
        .bg-in { background: #2ecc71; } .bg-out { background: #e74c3c; }

        /* MODAL POPUP STYLE */.modal-overlay { 
    position: fixed; 
    top: 0; 
    left: 50%; /* Geser ke tengah */
    width: 90%; 
    height: 100%; 
    
    display: none; 
    align-items: center; 
    justify-content: center; 
    z-index: 1000; 
    transform: translateX(-50%); /* Tarik balik 50% dari lebar overlay agar presisi di tengah */
}
/* Container Utama Inputan */
.input {
  position: relative;
  font-size: 1rem;
  background: linear-gradient(21deg, #ff7eb9, #7afcff);
  padding: 3px; /* Ketebalan border gradien */
  display: block; 
  border-radius: 50px; /* Gunakan nilai PX yang pasti agar lebih stabil */
  margin-bottom: 15px;
  box-shadow: none !important;
  z-index: 1;
}

/* Isi Input (Input, Select, Textarea) */
.input *:not(span) {
  position: relative;
  display: block;
  width: 100%;
  /* PERBAIKAN: Berikan radius spesifik, sedikit lebih kecil dari induk (50px - 3px) */
  border-radius: 47px !important; 
  margin: 0;
  border: none;
  outline: none;
  padding: 12px 20px;
  z-index: 2;
  background: #fff;
  box-sizing: border-box;
  font-family: inherit;
  transition: all 0.3s ease;
}

/* KHUSUS TEXTAREA agar radiusnya tidak terlalu tajam di tengah */
.input textarea {
  border-radius: 25px !important; /* Radius lebih kecil agar teks di dalam tidak terpotong */
  min-height: 80px;
  resize: none;
  padding: 15px 20px;
}

/* Penyesuaian khusus untuk Select agar tetap lonjong */
.input select {
  appearance: none; /* Menghilangkan panah default agar tidak merusak radius */
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23ff7eb9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 15px center;
  background-size: 15px;
}

/* Efek Glow & Animasi */
.input *:not(span):focus + span {
  opacity: 1;
  transform: scale(1);
}

.input span {
  transform: scale(0.98, 0.92);
  transition: transform 0.4s, opacity 0.25s;
  opacity: 0;
  position: absolute;
  z-index: 0;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: 50px;
  pointer-events: none;
  box-shadow: inset 0 0 0 3px #fff, 0 0 0 4px #fff, 3px -3px 30px #ff7eb9, -3px 3px 30px #7afcff;
}

    .modal-content { background: #fff; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.8em; }
        input, select, textarea { width: 100%; padding: 10px; border: 2px solid #ff7eb9; border-radius: 10px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; color: white; margin-top: 5px; }
        .btn-add { background: #2ecc71; } .btn-withdraw { background: #e74c3c; } .btn-save { background: var(--primary); }
        .btn-close { background: #95a5a6; margin-top: 10px; }

        .history-item { background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ddd; }
        .type-masuk { border-left-color: #2ecc71; } .type-keluar { border-left-color: #e74c3c; }

        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p id="loader-text" style="font-weight: 600; color: #d63384;">Sinkronisasi...</p>
</div>

<div id="modalSettings" class="modal-overlay">
    <div class="modal-content">
        <h4 style="margin:0 0 15px 0; color:var(--primary); text-align: center;">⚙️ Pengaturan</h4>
        <div class="form-group"><label>Tujuan Menabung</label><input type="text" id="set-target-name"></div>
        <div class="form-group"><label>Nominal Target</label><input type="number" id="set-target-amt"></div>
        <div class="form-group"><label>Tanggal Target</label><input type="date" id="set-target-date"></div>
        <div class="form-group"><label>PIN Keamanan</label><input type="number" id="set-pin"></div>
        <button class="btn-save" onclick="saveSettings()">Simpan</button>
        <button class="btn-close" onclick="toggleSettings()">Tutup</button>
    </div>
</div>

<div id="main-content" class="container">
    <div class="btn-settings" onclick="toggleSettings()"><i class="fa-solid fa-gear"></i></div>
    <h1>💕 Tabungan Kita</h1>
    <p class="subtitle">Refki & Intan</p>
    <div class="balance-card"><p style="margin:0; opacity:0.8;
    font-size:0.8em">Sisa Tabungan</p><h2 id="total-saldo">Rp 0</h2></div>
    
    <div class="target-section">
        <div class="target-header"><span id="txt-target-name">Tujuan</span><span id="txt-target-nominal">Target: Rp 0</span></div>
        <div class="progress-container"><div class="progress-bar" id="bar-progress"></div></div>
        <div class="target-footer">
            <span id="txt-percent" style="font-size: 0.85em; font-weight: bold; color: #d63384;">0%</span>
            <span id="txt-days-left" style="font-size: 0.75em; color: #666;">-</span>
        </div>
        <div id="txt-needed-amt" class="needed-info"></div>
    </div>




    <div class="stats-container">
        <div class="stats-box stats-add"><strong>Ditabung</strong><div class="stat-row"><span>Refki:</span><span id="add-refki">0</span></div><div class="stat-row"><span>Intan:</span><span id="add-intan">0</span></div></div>
        <div class="stats-box stats-draw"><strong>Ditarik</strong><div class="stat-row"><span>Refki:</span><span id="draw-refki">0</span></div><div class="stat-row"><span>Intan:</span><span id="draw-intan">0</span></div></div>
    </div>

    <div class="recap-container">
        <div class="recap-box bg-in">Gabungan Nabung<br><span id="total-all-in">Rp 0</span></div>
        <div class="recap-box bg-out">Gabungan Tarik<br><span id="total-all-out">Rp 0</span></div>
    </div>
    <div class="charts-container">
        <div class="chart-box">
            <h5>Kontribusi Nabung</h5>
            <canvas id="chartSaving"></canvas>
        </div>
        <div class="chart-box">
            <h5>Kontribusi Tarik</h5>
            <canvas id="chartExpense"></canvas>
        </div>
    </div>
    <div class="form-group">
        <label>Penginput</label>
        <span class="input">
            <select id="user">
                <option value="Refki">Refki</option>
                <option value="Intan">Intan</option>
            </select>
            <span></span>
        </span>
    </div>

    <div class="form-group">
        <label>Nominal (Rp)</label>
        <span class="input">
            <input type="number" id="amount" placeholder="Masukkan nominal...">
            <span></span>
        </span>
    </div>
    <div class="form-group">
        <label>Alasan</label>
        <span class="input">
            <input type="number" id="note" placeholder="contoh: Gajian/Jajan cilok">
            <span></span>
        </span>
    </div>

    
    <div style="display:flex; gap:10px"><button class="btn-add" onclick="processData('Masuk')">Tambah</button><button class="btn-withdraw" onclick="processData('Keluar')">Tarik</button></div>
    <h4>Riwayat:</h4>
    <div id="history-list" style="margin-top:20px"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxFfEoiKHVo_6AJ_W5vj-oAgd9-GMkRE1HrHDDKIXTMJ-UT-9fFAoOXf59GJIRGt4A/exec";
    const ERROR_IMG = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSI2Lr63EJ-e-HQWeYpJ3kT953aWenQLYpXdQ&s";
    
    let GLOBAL_SETTINGS = {};
    let savingChart, expenseChart;

    Chart.register(ChartDataLabels);

    async function init() {
        const pinInput = prompt("Masukkan PIN 6 Digit:");
        if (!pinInput) window.location.href = ERROR_IMG;
        try {
            const response = await fetch(SCRIPT_URL);
            const res = await response.json();
            GLOBAL_SETTINGS = res.settings;
            if (pinInput !== String(GLOBAL_SETTINGS.pin)) { alert("PIN SALAH!"); window.location.href = ERROR_IMG; return; }
            document.getElementById('loader').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            updateUI(res.transactions);
        } catch (e) { alert("Error database!"); }
    }

    function createCharts(addR, addI, drawR, drawI) {
        const commonOptions = {
            borderWidth: 0,
            plugins: {
                legend: { display: false },
                datalabels: {
                    color: '#fff',
                    font: { weight: 'bold', size: 10 },
                    formatter: (value, ctx) => ctx.chart.data.labels[ctx.dataIndex] + '\n' + value + '%',
                    textAlign: 'center'
                }
            }
        };
        const totalAdd = addR + addI || 1;
        const totalDraw = drawR + drawI || 1;

        if(savingChart) savingChart.destroy();
        savingChart = new Chart(document.getElementById('chartSaving'), {
            type: 'pie',
            data: { labels: ['Refki', 'Intan'], datasets: [{ data: [(addR/totalAdd*100).toFixed(1), (addI/totalAdd*100).toFixed(1)], backgroundColor: ['#6a11cb', '#ff7eb9'] }] },
            options: commonOptions
        });

        if(expenseChart) expenseChart.destroy();
        expenseChart = new Chart(document.getElementById('chartExpense'), {
            type: 'pie',
            data: { labels: ['Refki', 'Intan'], datasets: [{ data: [(drawR/totalDraw*100).toFixed(1), (drawI/totalDraw*100).toFixed(1)], backgroundColor: ['#e74c3c', '#f39c12'] }] },
            options: commonOptions
        });
    }

    function updateUI(data) {
        let saldo=0, tin=0, tout=0, addR=0, addI=0, drawR=0, drawI=0, html='';
        data.forEach(row => {
            const val = parseInt(row[3]) || 0;
            if (row[2] === "Masuk") { tin += val; if(row[1]==="Refki") addR+=val; else addI+=val; }
            else { tout += val; if(row[1]==="Refki") drawR+=val; else drawI+=val; }
        });
        saldo = tin - tout;

        document.getElementById('total-saldo').innerText = formatR(saldo);
        document.getElementById('add-refki').innerText = formatR(addR);
        document.getElementById('add-intan').innerText = formatR(addI);
        document.getElementById('draw-refki').innerText = formatR(drawR);
        document.getElementById('draw-intan').innerText = formatR(drawI);
        document.getElementById('total-all-in').innerText = formatR(tin);
        document.getElementById('total-all-out').innerText = formatR(tout);

        createCharts(addR, addI, drawR, drawI);

        // Ubah baris ini:
document.getElementById('txt-target-name').innerHTML = `Tujuan: <span
style="color: #ff7eb9;">${GLOBAL_SETTINGS.tujuan}</span>`;

        document.getElementById('txt-target-nominal').innerText = formatR(GLOBAL_SETTINGS.nominal);
        const pct = Math.min((saldo / GLOBAL_SETTINGS.nominal) * 100, 100).toFixed(1);
        document.getElementById('bar-progress').style.width = pct + "%";
        document.getElementById('txt-percent').innerText = pct + "%";

        const needed = GLOBAL_SETTINGS.nominal - saldo;
        const neededEl = document.getElementById('txt-needed-amt');
        neededEl.innerText = needed > 0 ? "Kurang " + formatR(needed) + " lagi" : "🏆 Target Tercapai!";
        neededEl.style.color = needed > 0 ? "#e74c3c" : "#2ecc71";

        const days = Math.ceil((new Date(GLOBAL_SETTINGS.tanggal) - new Date().setHours(0,0,0,0)) / 86400000);
        document.getElementById('txt-days-left').innerText = days >= 0 ? `Sisa ${days} Hari` : "Waktu Habis";

        data.slice().reverse().forEach(row => {
            html += `<div class="history-item ${row[2] === 'Masuk' ? 'type-masuk' : 'type-keluar'}">
                <div style="font-size:0.8em"><strong>${row[4]}</strong><br>${row[1]} • ${row[0]}</div>
                <div style="font-weight:600; color:${row[2]==='Masuk'?'#2ecc71':'#e74c3c'}">${row[2]==='Masuk'?'+':'-'} ${formatR(row[3])}</div>
            </div>`;
        });
        document.getElementById('history-list').innerHTML = html;
    }

    async function processData(tipe) {
        const amount = document.getElementById('amount').value;
        const note = document.getElementById('note').value;
        if (!amount || !note) return alert("Isi data!");
        showLoader("Mencatat...");
        const now = new Date();
        const payload = {
            tanggal: now.toLocaleString("id-ID", {day:'numeric', month:'long', year:'numeric'}) + ", " + now.toLocaleString("id-ID", {hour:'2-digit', minute:'2-digit'}) + " WIB",
            nama: document.getElementById('user').value,
            tipe: tipe,
            jumlah: parseInt(amount),
            alasan: note
        };
        await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        location.reload();
    }

    async function saveSettings() {
        const payload = { action: "updateSettings", tujuan: document.getElementById('set-target-name').value, nominal: parseInt(document.getElementById('set-target-amt').value), tanggal: document.getElementById('set-target-date').value, pin: document.getElementById('set-pin').value };
        showLoader("Menyimpan...");
        await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        location.reload();
    }

    function toggleSettings() {
        const modal = document.getElementById('modalSettings');
        if(modal.style.display === 'flex') {
            modal.style.display = 'none';
        } else {
            modal.style.display = 'flex';
            document.getElementById('set-target-name').value = GLOBAL_SETTINGS.tujuan;
            document.getElementById('set-target-amt').value = GLOBAL_SETTINGS.nominal;
            document.getElementById('set-target-date').value = GLOBAL_SETTINGS.tanggal;
            document.getElementById('set-pin').value = GLOBAL_SETTINGS.pin;
        }
    }

    function formatR(v) { return "Rp " + (v || 0).toLocaleString('id-ID'); }
    function showLoader(t) { document.getElementById('loader').style.display = "flex"; document.getElementById('loader-text').innerText = t; }

    init();
</script>
</body>
</html>
